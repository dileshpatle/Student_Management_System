<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>Student Management System</h1>
    <p>Add, search, update and delete student records</p>
</header>

<main>
    <section class="card">
        <h2 id="formTitle">Add Student</h2>

        <form id="studentForm">
            <input type="hidden" id="studentId">

            <div class="form-grid">
                <div>
                    <label>Name</label>
                    <input type="text" id="name" placeholder="Enter student name" required>
                </div>

                <div>
                    <label>Roll No</label>
                    <input type="text" id="rollNo" placeholder="Enter roll number" required>
                </div>

                <div>
                    <label>Class</label>
                    <input type="text" id="studentClass" placeholder="e.g. ECE 3rd Year" required>
                </div>

                <div>
                    <label>Marks</label>
                    <input type="number" id="marks" min="0" max="100" step="0.01" placeholder="0 - 100" required>
                </div>

                <div>
                    <label>Contact</label>
                    <input type="text" id="contact" placeholder="Enter contact number" required>
                </div>
            </div>

            <div class="buttons">
                <button type="submit" id="submitBtn">Add Student</button>
                <button type="button" id="cancelBtn" class="secondary hidden">Cancel Edit</button>
            </div>

            <p id="message"></p>
        </form>
    </section>

    <section class="card">
        <div class="list-header">
            <h2>Student Records</h2>
            <input type="text" id="search" placeholder="Search by name or roll number">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll No</th>
                        <th>Class</th>
                        <th>Marks</th>
                        <th>Contact</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTable"></tbody>
            </table>
        </div>

        <p id="emptyMessage" class="empty">No student records found.</p>
    </section>
</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
